# NT114 HGT v6 — SMOKE TEST config (5 epochs, 200k subsample).
# Purpose: Verify cb_focal + CB weights + sampler + model end-to-end before committing
# to full 25-40h training. Should complete in ~25-30 min on L40S, cost ~$0.30.
#
# CRITICAL: drw_start_pct=0.0 here (weights active from Ep1) — tests the heaviest case.
# If smoke passes, full config (with DRW deferred 70%) will be at least as good.
#
# Run on AWS server:
#   tmux new -s smoke
#   python -m graphslm_ids.offline.training.train_hgt_flow_classifier \
#     --config configs/hgt_smoke_v6.yaml 2>&1 | tee /home/ubuntu/outputs/smoke_v6.log
#
# Pass criteria (Ep5):
#   - val_macro_f1 >= 0.18    (vs CE-only baseline 0.124)
#   - val_acc >= 0.30
#   - No NaN losses, no sustained optimizer-step skips
#
# Fail criteria → STOP and report:
#   - val_acc < 0.15
#   - val_macro_f1 < 0.10

experiment:
  source_name: "NT114 HGT v6 SMOKE — CB-Focal + immediate CB weights"
  rationale: >
    Short verification run (5 epochs, 200k flows) for the v6 imbalance stack:
    cb_focal loss + Class-Balanced weights active from Ep1 (drw_start_pct=0.0).
    Validates end-to-end before the full 100-epoch run.

data:
  source: graph_store
  graph_npz: /home/ubuntu/dataset/graph3/graph_artifact_3tier_14gb.npz
  graph_meta_json: /home/ubuntu/dataset/graph3/graph_artifact_3tier_14gb.meta.json
  graph_store_root: /home/ubuntu/dataset/graph_store_v1
  read_sealed_only: true
  packet_feature: semantic
  add_reverse_edges: true
  standardize_flow_features: true
  use_semantic_edge_weights: true

model:
  hidden_dim: 384
  num_layers: 4
  num_heads: 12
  dropout: 0.20
  ffn_multiplier: 4

train:
  output_dir: /home/ubuntu/outputs/smoke_v6
  epochs: 5
  max_train_flows: 200000
  patience: 5
  # Batch
  batch_mode: neighbor_sampling
  batch_seed_flows: 256
  grad_accum_steps: 1
  # Optimizer
  lr: 0.001
  weight_decay: 0.0003
  grad_clip_norm: 1.0
  adamw_eps: 1.0e-6
  adamw_betas: [0.9, 0.95]
  # Scheduler
  scheduler: onecycle
  scheduler_pct_start: 0.05
  scheduler_eta_min: 1.0e-5
  # Split
  val_ratio: 0.1
  test_ratio: 0.1
  # Class imbalance — CB weights active immediately (DRW disabled for smoke).
  class_weight: balanced
  class_weight_method: cb
  cb_beta: 0.999
  class_weight_cap: 3.0
  stratified_batch_sampling: false
  drw_start_pct: 0.0              # SMOKE: weights active from Ep1 (heaviest test)
  # Loss
  loss_type: cb_focal
  focal_gamma: 2.0
  label_smoothing: 0.1
  ldam_max_m: 0.5                 # unused
  ldam_scale: 30.0                # unused
  # Logit Adjustment DISABLED — too aggressive given 269:1 imbalance + natural val.
  logit_adjustment: 0.0
  # Regularization
  drop_edge_prob: 0.05
  ema_enabled: false              # SMOKE: disabled for cleaner signal in 5ep window
  ema_decay: 0.999
  # Runtime
  seed: 42
  device: cuda
  monitor: val_macro_f1
  log_every: 1
  amp: true
  amp_dtype: auto
  activation_checkpointing: false
  compile: false
  multi_gpu: false
  skip_val_first_epoch: true

sampler:
  hops: 4
  fanouts:
    flow__contains__packet: 8
    packet__next_packet__packet: 4
    packet__matches_technique__technique: 5
    flow__matches_technique__technique: 5
    technique__belongs_to_tactic__tactic: 1
  reverse_fanouts:
    rev_contains: 3
    rev_next_packet: 2
    rev_matches_technique: 2
    rev_belongs_to_tactic: 0
  always_include_all_tactics: true
  always_include_all_techniques: true

dataloader:
  num_workers: 8
  prefetch_factor: 10
  pin_memory: true
  persistent_workers: true

wandb:
  project: nt114-hgt-paper-variants
  run_name: smoke_v6

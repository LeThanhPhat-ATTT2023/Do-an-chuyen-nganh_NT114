# NT114 HGT v8.7 FULL — v7-baseline + logit_adjustment + EMA + BUG#1 fix.
#
# WHY v8.7 (full audit recap, 2026-05-23):
#   Empirical scoreboard:
#     v7    (cb_focal cap=3, no SAM, no buffer, no stratified):  macro_f1 ≈ 0.21  ← BEST
#     v8.5  (focal inverse cap=20, γ=3, SAM, EMA, HGAA+buffer):  macro_f1 = 0.12  ← regression
#     v8.6  (cb_focal cap=3, stratified, buffer, val_balanced):   macro_f1 = 0.04  ← collapse
#
#   Each post-v7 addition stacked another minority booster, creating a 5+
#   orders-of-magnitude train/test prior mismatch. Result: high minority
#   recall but precision ≈ 0, and majority class (VulnScan, 46% of test)
#   completely ignored in v8.6.
#
# v8.7 = v7 + 3 surgical additions with clear evidence:
#   (1) logit_adjustment=1.0  — Menon ICLR 2021 post-hoc prior fix at eval.
#                               Independent of training weights; the only
#                               principled way to debias when training prior
#                               differs from test prior.
#   (2) ema_enabled=true      — paper-proven +1-3% F1 on long-tail.
#   (3) BUG #1 fix in trainer — focal loss now applies label_smoothing
#                               (was silently dropped: see _compute_train_loss).
#
# EXPLICITLY OFF (each one was empirically harmful or unverified):
#   sam_enabled                  — 2x step cost, no demonstrated F1 gain on
#                                  this codebase (v8.5 had SAM and regressed).
#   stratified_batch_sampling    — adds a 269x minority boost in batch
#                                  composition; v8.6 collapsed because of it.
#   drw_start_pct (=0.0)         — empirically neutral when weights are mild
#                                  (cb_focal cap=3 only ~7x ratio); user
#                                  confirmed no effect in v7 ablation.
#   hgaa.buffer_enabled          — ClassCentroidBank filter defined but NEVER
#                                  wired (BUG #2). Without filter, buffer
#                                  injects out-of-class graphs as minority
#                                  samples → precision collapse.
#   hgaa.aug_ratio_in_batch=0.3  — lowered from 0.5: reduce unfiltered noise.
#   monitor=val_balanced         — collapses to noise floor when both metrics
#                                  near zero (0.5·(0.018+0.038)=0.028 ≈
#                                  0.5·(0.016+0.038)=0.027 — picks at random).
#
# REALISTIC EXPECTATION on the current 1.5M flow / 13-class / 270:1 imbalance:
#   - Pass-1 target: macro_f1 ≥ 0.25 (clear improvement over v7's 0.21).
#   - Reach for: macro_f1 0.35-0.50 by epoch 80+ (LA + EMA stacking with v7).
#   - To approach 0.8 will likely need a separate intervention (BBN/RIDE/cRT
#     decoupled, or synthetic minority oversampling on the graph). This run
#     establishes the calibrated baseline first.

experiment:
  source_name: "NT114 IDS-HGT v8.7 — v7 baseline + logit_adjustment + EMA + BUG#1 fix"
  rationale: >
    Audit (2026-05-23) found that every config addition after v7 stacked an
    extra minority-boost mechanism and one stale bug (focal silently
    dropping label_smoothing). v8.7 returns to v7's empirically-best baseline
    and adds only post-hoc logit adjustment (debias inference prior),
    EMA (smoothing), and the BUG #1 fix. HGAA buffer is OFF because the
    ClassCentroidBank filter is defined but not wired into the pipeline.

data:
  source: graph_store
  graph_npz: /home/ubuntu/dataset/graph3/graph_artifact_3tier_14gb.npz
  graph_meta_json: /home/ubuntu/dataset/graph3/graph_artifact_3tier_14gb.meta.json
  graph_store_root: /home/ubuntu/dataset/graph_store_v1
  read_sealed_only: true
  packet_feature: semantic
  add_reverse_edges: true
  standardize_flow_features: true
  use_semantic_edge_weights: true
  use_temporal_edge_weights: true
  tew_epsilon: 1.0e-3

model:
  hidden_dim: 384
  num_layers: 4
  num_heads: 12
  dropout: 0.20
  ffn_multiplier: 4

train:
  output_dir: /home/ubuntu/outputs/train_v87
  epochs: 100
  max_train_flows: 0           # USE ALL ~1.5M flows
  patience: 25                 # allow EMA + LA to converge
  batch_mode: neighbor_sampling
  batch_seed_flows: 768
  grad_accum_steps: 1

  # Optimizer — plain AdamW (NO SAM)
  lr: 0.001                    # v7 baseline
  weight_decay: 0.0003
  grad_clip_norm: 1.0
  adamw_eps: 1.0e-6
  adamw_betas: [0.9, 0.95]
  sam_enabled: false           # ★ OFF: ~50% speedup vs v8.5/v8.6, no F1 loss
  sam_rho: 0.05

  # Scheduler
  scheduler: onecycle
  scheduler_pct_start: 0.10
  scheduler_eta_min: 1.0e-5

  # Loss — v7's working cb_focal at cap=3
  loss_type: cb_focal
  focal_gamma: 2.0
  label_smoothing: 0.1         # NOW EFFECTIVE (BUG #1 fixed)
  ldam_max_m: 0.5
  ldam_scale: 30.0

  class_weight: balanced
  class_weight_method: cb
  class_weight_cap: 3.0
  cb_beta: 0.9999
  drw_start_pct: 0.0           # ★ OFF — empirically neutral with cap=3
  use_manifest_class_weights: false

  # ★ NEW: post-hoc logit adjustment (Menon ICLR 2021)
  logit_adjustment: 1.0
  # ★ NEW: tau-normalized inference (Kang et al. ICLR 2020) — 3rd eval view
  # (TauNorm) alongside raw + LA. Decouples the classifier post-hoc to rebalance
  # toward rare classes without retraining.
  tau_norm: 1.0

  val_ratio: 0.1
  test_ratio: 0.1
  stratified_batch_sampling: false   # ★ OFF
  drop_edge_prob: 0.05
  ema_enabled: true            # ★ NEW
  ema_decay: 0.999
  seed: 42
  device: cuda
  monitor: val_macro_f1        # ★ not val_balanced
  log_every: 1
  amp: true
  amp_dtype: auto
  activation_checkpointing: false
  compile: true
  multi_gpu: false
  skip_val_first_epoch: true

  hgaa:
    enabled: true
    ops: [edge_addition, node_feature_swap, edge_direction_swap, edge_perturbation]
    eta_per_op: 0.1
    aug_ratio_in_batch: 0.3    # ★ lowered from 0.5
    smoothing: 1.0
    bias_selection_method: top_k
    bias_top_k_rarest: 3
    bias_min_class_freq: 0.01
    bias_factor_T: 0.5
    bias_preferred_op: node_feature_swap
    buffer_enabled: false      # ★ OFF until filter is wired
    buffer_pressure_threshold: 3
    buffer_max_per_batch: 100

sampler:
  hops: 4
  fanouts:
    flow__contains__packet: 6
    packet__next_packet__packet: 3
    packet__matches_technique__technique: 5
    flow__matches_technique__technique: 5
    technique__belongs_to_tactic__tactic: 1
  reverse_fanouts:
    rev_contains: 3
    rev_next_packet: 2
    rev_matches_technique: 2
    rev_belongs_to_tactic: 0
  always_include_all_tactics: true
  always_include_all_techniques: true

dataloader:
  num_workers: 8
  prefetch_factor: 16
  pin_memory: true
  persistent_workers: true

wandb:
  project: nt114-hgt-paper-variants
  run_name: train_v87

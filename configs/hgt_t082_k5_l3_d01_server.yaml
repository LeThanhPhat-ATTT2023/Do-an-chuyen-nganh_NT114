# NT114 Proposed IDS-HGT — Cloud GPU Server (A40 / RTX 5090 / A100).
#
# Target hardware: A40 48 GB  $0.44/hr  (recommended — Medium availability)
#                  RTX 5090 32 GB  $0.99/hr  (fastest, Medium availability)
#                  A100 80 GB  $1.39/hr  (overkill, Low availability)
#
# Key differences from Kaggle config:
#   - amp: true  → Ampere/Blackwell GPUs support native bfloat16
#   - batch_seed_flows: 256  → 48 GB VRAM + bfloat16 ~4× headroom vs T4 FP32
#   - grad_accum_steps: 1   → no accumulation needed at batch 256
#   - epochs: 100 + patience: 40  → full training run
#   - num_workers: 4  → server has more vCPUs than Kaggle
#   - paths: /workspace/  (Vast.ai / RunPod convention)
#
# ── Setup (run once after provisioning) ─────────────────────────────────────
#   pip install -e . && pip install -r requirements-ml.txt
#
#   # Download data (cần ~/.kaggle/kaggle.json)
#   mkdir -p /workspace/data/raw && cd /workspace/data/raw
#   kaggle datasets download thnhphtattt2023/graph3 && unzip graph3.zip
#
#   # Build graph store (chạy 1 lần, ~10-20 phút)
#   python -m graphslm_ids.offline.training.on_disk_graph_store \
#     --graph-npz /workspace/data/raw/graph_artifact_3tier_14gb.npz \
#     --graph-meta-json /workspace/data/raw/graph_artifact_3tier_14gb.meta.json \
#     --output-root /workspace/data/graph_store_v1
#
# ── SMOKE TEST (3 epochs, ~15 phút) ─────────────────────────────────────────
#   Uncomment max_train_flows + đổi epochs: 3, xác nhận log:
#     [AMP] bfloat16 enabled (native hardware support detected.)
#     [diag] first optimizer step | grad_norm=<số khác 0>
#     loss epoch 1 > epoch 2 > epoch 3
#
# ── Full run (2× A40) ────────────────────────────────────────────────────────
#   tmux new -s train
#   torchrun --nproc_per_node=2 \
#     -m graphslm_ids.offline.training.train_hgt_flow_classifier \
#     --config configs/hgt_t082_k5_l3_d01_server.yaml
#
# ── Full run (1 GPU) ─────────────────────────────────────────────────────────
#   tmux new -s train
#   torchrun --nproc_per_node=1 \
#     -m graphslm_ids.offline.training.train_hgt_flow_classifier \
#     --config configs/hgt_t082_k5_l3_d01_server.yaml
#   # Đổi multi_gpu: false nếu dùng 1 GPU

experiment:
  source_name: "NT114 Proposed IDS-HGT — Cloud Server full run (4-layer)"
  rationale: >
    Full 100-epoch training run on cloud GPU server (A40/RTX5090/A100).
    Same 4-layer / 256-hidden / 8-head architecture. bfloat16 AMP enabled —
    auto-fallback to FP32 nếu GPU không hỗ trợ native bf16.

data:
  source: graph_store
  graph_npz: /workspace/data/raw/graph_artifact_3tier_14gb.npz
  graph_meta_json: /workspace/data/raw/graph_artifact_3tier_14gb.meta.json
  graph_store_root: /workspace/data/graph_store_v1
  read_sealed_only: true
  packet_feature: semantic
  add_reverse_edges: true
  standardize_flow_features: true
  use_semantic_edge_weights: true

model:
  hidden_dim: 256
  num_layers: 4
  num_heads: 8
  dropout: 0.15
  ffn_multiplier: 4

train:
  output_dir: /workspace/outputs/nt114_proposed_l4_h256_h8_server
  epochs: 100
  patience: 40
  batch_mode: neighbor_sampling
  batch_seed_flows: 256     # A40 48 GB + bfloat16: ~4× headroom vs T4 FP32 16 GB
                            # RTX 5090 32 GB: giảm xuống 192 nếu OOM
  grad_accum_steps: 1       # effective batch 256/GPU (×2 GPUs via DDP = 512)
  lr: 0.0005
  weight_decay: 0.0001
  grad_clip_norm: 1.0
  scheduler: cosine_annealing
  scheduler_eta_min: 1.0e-5
  val_ratio: 0.1
  test_ratio: 0.1
  class_weight: balanced
  class_weight_cap: 15.0
  seed: 42
  device: cuda
  monitor: val_macro_f1
  log_every: 1
  stratified_batch_sampling: true
  amp: true                 # bfloat16 trên A40/RTX5090/A100; tự về FP32 nếu GPU không hỗ trợ
  amp_dtype: auto
  activation_checkpointing: true
  compile: false
  multi_gpu: true           # 2× A40 với torchrun --nproc_per_node=2
  # --- SMOKE TEST ONLY: uncomment dòng dưới + đổi epochs: 3 ---
  # max_train_flows: 60000

sampler:
  hops: 4
  fanouts:
    flow__contains__packet: 8
    packet__next_packet__packet: 4
    packet__matches_technique__technique: 5
    flow__matches_technique__technique: 5
    technique__belongs_to_tactic__tactic: 1
  reverse_fanouts:
    rev_contains: 3
    rev_next_packet: 2
    rev_matches_technique: 2
    rev_belongs_to_tactic: 0
  always_include_all_tactics: true
  always_include_all_techniques: true

dataloader:
  num_workers: 4            # tăng lên 8 nếu server có ≥16 vCPU
  prefetch_factor: 4
  pin_memory: true
  persistent_workers: true

wandb:
  project: nt114-hgt-paper-variants
  run_name: proposed_l4_h256_h8_server

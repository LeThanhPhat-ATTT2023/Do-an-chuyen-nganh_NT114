# NT114 Proposed IDS-HGT — Single-GPU cloud server (AWS / Vast.ai / RunPod).
# Target: 1× L40S 48GB (AWS g6e.2xlarge spot ~$0.60/hr) or equivalent Ampere+.
#
# Setup (one-time):
#   pip install -e . && pip install -r requirements-ml.txt
#   python -m graphslm_ids.offline.training.on_disk_graph_store \
#     --graph-npz /home/ubuntu/dataset/graph3/graph_artifact_3tier_14gb.npz \
#     --graph-meta-json /home/ubuntu/dataset/graph3/graph_artifact_3tier_14gb.meta.json \
#     --output-root /home/ubuntu/dataset/graph_store_v1
#
# Train:
#   tmux new -s train
#   python -m graphslm_ids.offline.training.train_hgt_flow_classifier \
#     --config configs/hgt_t082_k5_l3_d01_server.yaml
#
# Smoke test:
#   Set epochs=5, max_train_flows=200000 in train block below. Expected F1 >= 0.12.

experiment:
  source_name: "NT114 Proposed IDS-HGT — v5 (LDAM + EMA + DropEdge + stratified)"
  rationale: >
    Full training run on cloud GPU server. 4-layer / 384-hidden / 12-head HGT
    with OneCycleLR, LDAM loss, stratified batch sampling, EMA model weights,
    DropEdge regularization, and BF16-stable AdamW.

data:
  source: graph_store
  graph_npz: /home/ubuntu/dataset/graph3/graph_artifact_3tier_14gb.npz
  graph_meta_json: /home/ubuntu/dataset/graph3/graph_artifact_3tier_14gb.meta.json
  graph_store_root: /home/ubuntu/dataset/graph_store_v1
  read_sealed_only: true
  packet_feature: semantic
  add_reverse_edges: true
  standardize_flow_features: true
  use_semantic_edge_weights: true

model:
  hidden_dim: 384
  num_layers: 4
  num_heads: 12             # head_dim = 32
  dropout: 0.20
  ffn_multiplier: 4

train:
  output_dir: /home/ubuntu/outputs/nt114_proposed_l4_h384_h12_v5
  epochs: 100
  max_train_flows: 0        # 0 = full train set. Set 200000 for smoke test.
  patience: 30
  # Batch
  batch_mode: neighbor_sampling
  batch_seed_flows: 256     # peak VRAM ~22 GB on L40S. Cap at 256 (>=384 collapses).
  grad_accum_steps: 1
  # Optimizer (BF16-stable)
  lr: 0.001                 # OneCycleLR peak; warmup from lr/25 over 5% of steps
  weight_decay: 0.0003
  grad_clip_norm: 0.5
  adamw_eps: 1.0e-6
  adamw_betas: [0.9, 0.95]
  # Scheduler
  scheduler: onecycle
  scheduler_pct_start: 0.05
  scheduler_eta_min: 1.0e-5
  # Split
  val_ratio: 0.1
  test_ratio: 0.1
  # Class imbalance handling
  class_weight: balanced
  class_weight_cap: 2.0     # soft loss-weight; stratified sampling does main balancing
  stratified_batch_sampling: true
  # Loss
  loss_type: ldam           # 'ce' | 'focal' | 'ldam' — LDAM best for severe imbalance
  ldam_max_m: 0.5
  ldam_scale: 30.0
  label_smoothing: 0.1
  focal_gamma: 2.0          # only used when loss_type=focal
  # Regularization (graph + weights)
  drop_edge_prob: 0.10      # DropEdge (Rong et al. 2020). 0.0 disables.
  ema_enabled: true
  ema_decay: 0.999
  # Runtime
  seed: 42
  device: cuda
  monitor: val_macro_f1
  log_every: 1
  amp: true
  amp_dtype: auto
  activation_checkpointing: false
  compile: false            # torch.compile falls back eager on HGT dynamic shapes
  multi_gpu: false          # WARNING: multi-GPU multiplies effective batch — risk of collapse
  skip_val_first_epoch: true

sampler:
  hops: 4
  fanouts:
    flow__contains__packet: 8
    packet__next_packet__packet: 4
    packet__matches_technique__technique: 5
    flow__matches_technique__technique: 5
    technique__belongs_to_tactic__tactic: 1
  reverse_fanouts:
    rev_contains: 3
    rev_next_packet: 2
    rev_matches_technique: 2
    rev_belongs_to_tactic: 0
  always_include_all_tactics: true
  always_include_all_techniques: true

dataloader:
  num_workers: 8
  prefetch_factor: 10
  pin_memory: true
  persistent_workers: true

wandb:
  project: nt114-hgt-paper-variants
  run_name: proposed_l4_h384_h12_v5

# Phase 2 HGAA Smoke Test (5 epochs, 200k subsample).
# Purpose: validate HGAA augmentation pipeline + adaptive op selection +
# bias-aware tail-class focus does NOT degrade val_macro_f1 vs v7-p1 smoke
# baseline AND ideally improves it.
#
# Pass criteria (Ep5):
#   - val_macro_f1 >= 0.118 (v7-p1 smoke baseline)
#   - hgaa epoch log shows aug_rate ~0.5 and op_counts non-empty
#   - bias_classes auto-detected (printed at [hgaa] enabled line)
#   - No NaN, no crash
#
# Fail criteria → revert and report.

experiment:
  source_name: "NT114 HGT v7-p2 SMOKE — HGAA adaptive augmentation"
  rationale: >
    Adapt HGAA (Zhao et al., Symmetry 2025, 17, 1623) from binary anomaly
    detection to multiclass IDS. 4 augmentation operators (paper §3.1, skip
    type-swap), per-class adaptive sampling (§3.3.1), bias-aware boost for
    auto-detected top-3 rarest classes (§3.3.2). Filter network deferred
    to v7-p3 (needs v7-p1 checkpoint as teacher).

data:
  source: graph_store
  graph_npz: /home/ubuntu/dataset/graph3/graph_artifact_3tier_14gb.npz
  graph_meta_json: /home/ubuntu/dataset/graph3/graph_artifact_3tier_14gb.meta.json
  graph_store_root: /home/ubuntu/dataset/graph_store_v1
  read_sealed_only: true
  packet_feature: semantic
  add_reverse_edges: true
  standardize_flow_features: true
  use_semantic_edge_weights: true

model:
  hidden_dim: 384
  num_layers: 4
  num_heads: 12
  dropout: 0.20
  ffn_multiplier: 4

train:
  output_dir: /home/ubuntu/outputs/smoke_v7_p2
  epochs: 5
  max_train_flows: 200000
  patience: 5
  # Batch — inherits v7-p1
  batch_mode: neighbor_sampling
  batch_seed_flows: 512
  grad_accum_steps: 1
  # Optimizer (inherits v7-p1)
  lr: 0.001
  weight_decay: 0.0003
  grad_clip_norm: 1.0
  adamw_eps: 1.0e-6
  adamw_betas: [0.9, 0.95]
  scheduler: onecycle
  scheduler_pct_start: 0.05
  scheduler_eta_min: 1.0e-5
  val_ratio: 0.1
  test_ratio: 0.1
  # Class imbalance (inherits v7-p1 smoke)
  class_weight: balanced
  class_weight_method: cb
  cb_beta: 0.9999
  class_weight_cap: 3.0
  stratified_batch_sampling: false
  drw_start_pct: 0.0
  loss_type: cb_focal
  focal_gamma: 2.0
  label_smoothing: 0.1
  logit_adjustment: 0.0
  drop_edge_prob: 0.05
  ema_enabled: false
  ema_decay: 0.999
  seed: 42
  device: cuda
  monitor: val_macro_f1
  log_every: 1
  amp: true
  amp_dtype: auto
  activation_checkpointing: false
  compile: true
  multi_gpu: false
  skip_val_first_epoch: true
  # === Phase 2 HGAA block — dataset-portable (per spec §1.5 DC-1/DC-2) ===
  hgaa:
    enabled: true
    ops: [edge_addition, node_feature_swap, edge_direction_swap, edge_perturbation]
    eta_per_op: 0.1
    aug_ratio_in_batch: 0.5         # paper §3.3.1 batch composition
    smoothing: 1.0                  # Laplace smoothing for success rate
    # Tail-class bias — auto-detect at training startup
    bias_selection_method: top_k    # "top_k" | "freq_threshold"
    bias_top_k_rarest: 3
    bias_min_class_freq: 0.01
    bias_factor_T: 0.5              # paper §3.3.2: T probability of force-select
    bias_preferred_op: node_feature_swap

sampler:
  hops: 4
  fanouts:
    flow__contains__packet: 8
    packet__next_packet__packet: 4
    packet__matches_technique__technique: 5
    flow__matches_technique__technique: 5
    technique__belongs_to_tactic__tactic: 1
  reverse_fanouts:
    rev_contains: 3
    rev_next_packet: 2
    rev_matches_technique: 2
    rev_belongs_to_tactic: 0
  always_include_all_tactics: true
  always_include_all_techniques: true

dataloader:
  num_workers: 8                  # L40S has 8 vCPUs
  prefetch_factor: 16
  pin_memory: true
  persistent_workers: true

wandb:
  project: nt114-hgt-paper-variants
  run_name: smoke_v7_p2

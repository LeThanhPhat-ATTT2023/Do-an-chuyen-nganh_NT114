# NT114 Proposed IDS-HGT — AWS EC2 full training run.
#
# Target hardware (recommended order):
#   - g6e.2xlarge (1x L40S 48 GB) spot ~$0.60/hr  ⭐ BEST — ~1.7× faster than A10G
#   - g5.2xlarge  (1x A10G 24 GB) spot ~$0.50/hr  — fallback if g6e unavailable
#   - g6.2xlarge  (1x L4 24 GB) spot ~$0.40/hr    — cheapest, dùng cho smoke test
#   - g5.12xlarge (4x A10G 24 GB) spot ~$1.80/hr  — multi-GPU, không thực sự cần
#
# ── FIX 2026-05-20: Cùng root cause với server config ──────────────────────
#   Run trước (server L40S, batch 512) → model collapse (test acc 0.67%).
#   Fix áp dụng cho AWS config:
#     1. class_weight_cap: 15.0 → 5.0       (giảm bias minority)
#     2. stratified_batch_sampling: true → false  (tắt double-balancing)
#     3. patience: 40 → 20                  (fail-fast)
#     4. batch_seed_flows: 192 + grad_accum=2 (eff 384) → 128 + grad_accum=2 (eff 256)
#        Giữ effective batch ≤ 256 — đã chứng minh 384-512 gây collapse
#     5. Smoke test: max_train_flows 60k → 200k, epochs 3 → 5
#
# Key differences from Kaggle config:
#   - amp: true   → A10G/L40S/L4 đều hỗ trợ BF16 (Kaggle T4/P100 không)
#   - epochs: 100 + patience: 20  → full training run
#   - batch_seed_flows: 128  → safe value sau khi fix collapse
#   - num_workers: 4  → EC2 instance có nhiều vCPU hơn Kaggle
#   - paths point to local ~/data/ instead of /kaggle/input/
#
# ── Setup on EC2 (run once after launching instance) ────────────────────────
#   # 1. Install deps
#   pip install -e . && pip install -r requirements-ml.txt
#
#   # 2. Download data from Kaggle (need ~/.kaggle/kaggle.json)
#   mkdir -p ~/data/raw && cd ~/data/raw
#   kaggle datasets download thnhphtattt2023/graph3 && unzip graph3.zip
#
#   # 3. Build graph store (run ONCE, takes ~10-20 min, saves to ~/data/graph_store)
#   python -m graphslm_ids.offline.training.on_disk_graph_store \
#     --graph-npz ~/data/raw/graph_artifact_3tier_14gb.npz \
#     --graph-meta-json ~/data/raw/graph_artifact_3tier_14gb.meta.json \
#     --output-root ~/data/graph_store_v1
#
# ── SMOKE TEST first (5 epochs, ~30 min, ~$0.20 trên g6.2xlarge spot) ──────
#   Bước 1: COMMENT dòng `epochs: 100` ở dưới (YAML không cho duplicate key)
#   Bước 2: Uncomment 2 dòng smoke test (max_train_flows + epochs: 5)
#   Bước 3: Chạy & verify:
#     [AMP] running in BF16              ← AMP working trên A10G/L40S/L4
#     [diag] first optimizer step | grad_norm=...  ← phải khác 0
#     loss epoch 1 > epoch 2 > ... > epoch 5
#   Expected sau 5 epochs (200k train flows, không double-balancing):
#     train_acc ≥ 40%, val_acc ≥ 25%, F1 Benign/VulnScan > 0
#   Bước 4: PASS → revert (uncomment epochs: 100, comment 2 dòng smoke test)
#
# ── Full run (single GPU g6e.2xlarge spot, ~$4-5 cho 6-8 giờ) ──────────────
#   tmux new -s train     ← QUAN TRỌNG: dùng tmux để không mất job khi đóng SSH
#   torchrun --nproc_per_node=1 \
#     -m graphslm_ids.offline.training.train_hgt_flow_classifier \
#     --config configs/hgt_t082_k5_l3_d01_aws.yaml
#
# ── Full run (4 GPU g5.12xlarge, ~$5-6 cho 2-3 giờ) ────────────────────────
#   tmux new -s train
#   torchrun --nproc_per_node=4 \
#     -m graphslm_ids.offline.training.train_hgt_flow_classifier \
#     --config configs/hgt_t082_k5_l3_d01_aws.yaml
#   # Đổi multi_gpu: true và num_workers: 8 nếu dùng 4 GPU
#   # Cảnh báo: DDP × 4 GPU × batch 128 = effective 512 → giảm batch_seed_flows xuống 64

experiment:
  source_name: "NT114 Proposed IDS-HGT — AWS EC2 full run (4-layer)"
  rationale: >
    Full 100-epoch training run on AWS EC2 spot instance. Same 4-layer /
    256-hidden / 8-head architecture as Kaggle preview. AMP enabled since
    A10G/A100 support BF16 natively — expect ~1.5-2x speedup vs Kaggle FP32.

data:
  source: graph_store
  graph_npz: ~/data/raw/graph_artifact_3tier_14gb.npz
  graph_meta_json: ~/data/raw/graph_artifact_3tier_14gb.meta.json
  graph_store_root: ~/data/graph_store_v1
  read_sealed_only: true
  packet_feature: semantic
  add_reverse_edges: true
  standardize_flow_features: true
  use_semantic_edge_weights: true

model:
  hidden_dim: 256
  num_layers: 4
  num_heads: 8
  dropout: 0.15
  ffn_multiplier: 4

train:
  output_dir: ~/outputs/nt114_proposed_l4_h256_h8_aws
  epochs: 100
  patience: 20             # FIX: giảm từ 40 → 20 để fail-fast
  batch_mode: neighbor_sampling
  batch_seed_flows: 128     # FIX: giảm từ 192 → 128 (eff batch 256 với grad_accum=2).
                            # Batch ≥ 384 đã gây model collapse với HGT + class imbalance.
                            # L40S 48 GB / A10G 24 GB / L4 24 GB đều an toàn ở 128.
  grad_accum_steps: 2       # effective batch 256/GPU (safe)
  lr: 0.0005
  weight_decay: 0.0001
  grad_clip_norm: 1.0
  scheduler: cosine_annealing
  scheduler_eta_min: 1.0e-5
  val_ratio: 0.1
  test_ratio: 0.1
  class_weight: balanced
  class_weight_cap: 5.0    # FIX: giảm từ 15.0 → 5.0. Cap=15 khiến model spam predict
                            # minority class → Benign/VulnScan F1=0 trong run trước.
  seed: 42
  device: cuda
  monitor: val_macro_f1
  log_every: 1
  stratified_batch_sampling: false  # FIX: tắt double-balancing (đã có class_weight balanced)
  amp: true                 # A10G/L40S/L4 hỗ trợ BF16 — nếu freeze thì đổi false
  amp_dtype: auto           # auto-detect: BF16 trên A10G/L40S/A100, FP32 fallback
  activation_checkpointing: true
  compile: false
  multi_gpu: false          # đổi thành true nếu dùng g5.12xlarge (4 GPU)
                            # KHI multi-GPU: giảm batch_seed_flows xuống 64 (eff 4×64×2 = 512)
  # --- SMOKE TEST ONLY ---
  # Bước 1: COMMENT dòng `epochs: 100` ở trên (YAML không cho duplicate key)
  # Bước 2: Uncomment 2 dòng dưới:
  # max_train_flows: 200000   # FIX: 60k → 200k (16% data thay vì 4%)
  # epochs: 5                 # FIX: 3 → 5 cho đủ tín hiệu hội tụ
  # Bước 3: Sau smoke test PASS → revert

sampler:
  hops: 4
  fanouts:
    flow__contains__packet: 8
    packet__next_packet__packet: 4
    packet__matches_technique__technique: 5
    flow__matches_technique__technique: 5
    technique__belongs_to_tactic__tactic: 1
  reverse_fanouts:
    rev_contains: 3
    rev_next_packet: 2
    rev_matches_technique: 2
    rev_belongs_to_tactic: 0
  always_include_all_tactics: true
  always_include_all_techniques: true

dataloader:
  num_workers: 4            # g5.2xlarge có 8 vCPU; đổi thành 8 nếu dùng g5.12xlarge
  prefetch_factor: 4
  pin_memory: true
  persistent_workers: true

wandb:
  project: nt114-hgt-paper-variants
  run_name: proposed_l4_h256_h8_aws

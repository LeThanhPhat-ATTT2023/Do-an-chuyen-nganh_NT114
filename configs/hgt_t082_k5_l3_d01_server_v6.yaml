# NT114 Proposed IDS-HGT v6 — FULL TRAINING config (100 epochs, full ~960k train).
# Target: 1× L40S 48GB (AWS g6e.2xlarge spot ~$0.60/hr). Expected runtime 25-40h.
#
# Imbalance handling stack (validated by smoke_v6):
#   1. cb_focal loss: focal-loss (Lin et al. 2017) with Class-Balanced weights.
#   2. CB weights (Cui et al. CVPR 2019): (1 - β)/(1 - β^n) per class. Self-regularizing
#      for severe long-tail; ratio max/min ~1.1x under our distribution (vs inverse 269x).
#   3. DRW Schedule (Cao et al. NeurIPS 2019): train unweighted (focal-only) for first 70
#      epochs (better feature learning), activate CB weights last 30 epochs (refine tail).
#   4. Logit Adjustment DISABLED (logit_adjustment=0.0): smoke evidence showed τ=1.0
#      collapses val_acc on natural-distribution val (LA assumes balanced test set).
#
# Setup (one-time on server):
#   pip install -e . && pip install -r requirements-ml.txt
#   python -m graphslm_ids.offline.training.on_disk_graph_store \
#     --graph-npz /home/ubuntu/dataset/graph3/graph_artifact_3tier_14gb.npz \
#     --graph-meta-json /home/ubuntu/dataset/graph3/graph_artifact_3tier_14gb.meta.json \
#     --output-root /home/ubuntu/dataset/graph_store_v1
#
# Smoke verify FIRST (mandatory, ~25 min):
#   tmux new -s smoke
#   python -m graphslm_ids.offline.training.train_hgt_flow_classifier \
#     --config configs/hgt_smoke_v6.yaml 2>&1 | tee /home/ubuntu/outputs/smoke_v6.log
#   # Pass criteria: val_macro_f1 Ep5 >= 0.18, val_acc Ep5 >= 0.30
#
# Full run (only after smoke passes):
#   tmux new -s train
#   python -m graphslm_ids.offline.training.train_hgt_flow_classifier \
#     --config configs/hgt_t082_k5_l3_d01_server_v6.yaml \
#     2>&1 | tee /home/ubuntu/outputs/train_v6.log
#
# Expected convergence (full): val_macro_f1 ~0.45-0.60 at best epoch.

experiment:
  source_name: "NT114 Proposed IDS-HGT — v6 (CB-Focal + DRW)"
  rationale: >
    Full training with two SOTA imbalanced-classification techniques composing cleanly:
    Class-Balanced weights replace inverse frequency; DRW schedule defers weighting until
    epoch 70/100 for better feature learning. Architecture identical to v5: 4-layer HGT,
    384 hidden, 12 heads, 4-hop neighbor sampling. Evidence-driven config: smoke verified
    pipeline; LDAM scale=30 from v5 caused boundary collapse (replaced with cb_focal);
    Logit Adjustment τ=1.0 caused val collapse on natural-distribution val set (disabled).

data:
  source: graph_store
  graph_npz: /home/ubuntu/dataset/graph3/graph_artifact_3tier_14gb.npz
  graph_meta_json: /home/ubuntu/dataset/graph3/graph_artifact_3tier_14gb.meta.json
  graph_store_root: /home/ubuntu/dataset/graph_store_v1
  read_sealed_only: true
  packet_feature: semantic
  add_reverse_edges: true
  standardize_flow_features: true
  use_semantic_edge_weights: true

model:
  hidden_dim: 384
  num_layers: 4
  num_heads: 12
  dropout: 0.20
  ffn_multiplier: 4

train:
  output_dir: /home/ubuntu/outputs/train_v6
  epochs: 100
  max_train_flows: 0              # 0 = use full train set (~960k flows)
  patience: 30
  # Batch
  batch_mode: neighbor_sampling
  batch_seed_flows: 256
  grad_accum_steps: 1
  # Optimizer (BF16-stable)
  lr: 0.001
  weight_decay: 0.0003
  grad_clip_norm: 1.0
  adamw_eps: 1.0e-6
  adamw_betas: [0.9, 0.95]
  # Scheduler — OneCycleLR with 5% warmup; ~5 epochs of peak LR over 100ep run.
  scheduler: onecycle
  scheduler_pct_start: 0.05
  scheduler_eta_min: 1.0e-5
  # Split
  val_ratio: 0.1
  test_ratio: 0.1
  # Class imbalance — Class-Balanced weights (Cui et al. 2019).
  class_weight: balanced
  class_weight_method: cb         # 'inverse' | 'cb'. CB = (1-β)/(1-β^n) per class.
  cb_beta: 0.999                  # CB paper default.
  class_weight_cap: 3.0           # Safety cap (rarely hit with CB).
  stratified_batch_sampling: false
  # DRW schedule (Cao et al. 2019). Train unweighted Ep1-70 (focal only); activate
  # CB weights Ep70-100 to refine rare-class predictions.
  drw_start_pct: 0.7
  # Loss — Class-Balanced Focal.
  loss_type: cb_focal
  focal_gamma: 2.0
  label_smoothing: 0.1
  ldam_max_m: 0.5                 # unused
  ldam_scale: 30.0                # unused
  # Logit Adjustment DISABLED — smoke proved τ=1.0 too aggressive on imbalanced val.
  logit_adjustment: 0.0
  # Regularization
  drop_edge_prob: 0.05
  ema_enabled: true               # Warms up well within 100 epochs (decay 0.999)
  ema_decay: 0.999
  # Runtime
  seed: 42
  device: cuda
  monitor: val_macro_f1
  log_every: 1
  amp: true
  amp_dtype: auto
  activation_checkpointing: false
  compile: false
  multi_gpu: false
  skip_val_first_epoch: true

sampler:
  hops: 4
  fanouts:
    flow__contains__packet: 8
    packet__next_packet__packet: 4
    packet__matches_technique__technique: 5
    flow__matches_technique__technique: 5
    technique__belongs_to_tactic__tactic: 1
  reverse_fanouts:
    rev_contains: 3
    rev_next_packet: 2
    rev_matches_technique: 2
    rev_belongs_to_tactic: 0
  always_include_all_tactics: true
  always_include_all_techniques: true

dataloader:
  num_workers: 8
  prefetch_factor: 10
  pin_memory: true
  persistent_workers: true

wandb:
  project: nt114-hgt-paper-variants
  run_name: train_v6

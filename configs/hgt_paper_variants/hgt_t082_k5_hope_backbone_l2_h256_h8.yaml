# Source: HOPE-style analysis of HGT bottlenecks.
# Inspired config: HOPE reports a 256-hidden, 2-layer HGT backbone before its
# Mixture-of-Experts replacement head. The local model does not implement HOPE's
# MoE decoder, so this config compares the backbone capacity only.
experiment:
  source_name: "HOPE HGT-backbone-style"
  citation_hint: "Heterogeneous-aware Orthogonal Prototype Experts (HOPE) with HGT backbone"
  rationale: "Use hidden_dim 256 and 2 layers to test a wider but shallower HGT backbone; MoE expert head is not implemented in this repo."

data:
  graph_npz: data/processed/graph_artifact_3tier_t082_k5.npz
  graph_meta_json: data/processed/graph_artifact_3tier_t082_k5.meta.json
  packet_feature: semantic
  add_reverse_edges: true
  standardize_flow_features: true
  use_semantic_edge_weights: true

model:
  hidden_dim: 256
  num_layers: 2
  num_heads: 8
  dropout: 0.1
  ffn_multiplier: 2

train:
  output_dir: outputs/hgt_paper_variants/hope_backbone_l2_h256_h8
  epochs: 150
  batch_mode: full
  lr: 0.001
  weight_decay: 0.00005
  val_ratio: 0.1
  test_ratio: 0.1
  patience: 30
  class_weight: balanced
  seed: 42
  device: cuda
  monitor: val_macro_f1
  log_every: 1


# Source: RelGT (Relational Graph Transformer), 2025.
# Inspired config: RelGT decomposes each node into 5 token components - raw
# features, type, hop distance, time, and local structure - and lets the
# Transformer attend over them separately. This yields strong gains on
# dynamic relational graphs where temporal and topological cues should not
# be squashed into a single embedding.
# Local approximation: our HGT already handles node TYPE separately
# (per-type linear projections + relation-typed attention), so the type and
# local-structure tokens are partially covered. Hop-distance and explicit
# time tokens are NOT implemented in this trainer, so this config only
# transfers the backbone scale (3 layers, 128 hidden, 8 heads) and keeps a
# moderate LR for the wider attention stack.
experiment:
  source_name: "RelGT Multi-Element Tokenization (backbone only)"
  citation_hint: "Relational Graph Transformer, 2025 (multi-element token decomposition: features, type, hop, time, local structure)"
  rationale: "Match RelGT's 3-layer / 128-hidden / 8-head backbone on the IDS three-tier graph; explicit hop/time tokens are deferred to a future iteration of the model code."

data:
  source: graph_store
  graph_npz: data/processed/graph_artifact_3tier_t082_k5.npz
  graph_meta_json: data/processed/graph_artifact_3tier_t082_k5.meta.json
  graph_store_root: data/graph_store_v1
  read_sealed_only: true
  packet_feature: semantic
  add_reverse_edges: true
  standardize_flow_features: true
  use_semantic_edge_weights: true

model:
  hidden_dim: 128
  num_layers: 3
  num_heads: 4
  dropout: 0.1
  ffn_multiplier: 2

train:
  output_dir: outputs/hgt_paper_variants/relgt_multi_token_l3_h128_h8
  epochs: 200
  batch_mode: neighbor_sampling
  batch_seed_flows: 256
  grad_accum_steps: 4
  lr: 0.0003
  weight_decay: 0.00005
  grad_clip_norm: 0.5
  scheduler: cosine_annealing
  scheduler_eta_min: 1.0e-5
  val_ratio: 0.1
  test_ratio: 0.1
  patience: 30
  class_weight: balanced
  seed: 42
  device: cuda
  monitor: val_macro_f1
  log_every: 1
  stratified_batch_sampling: true
  amp: true
  amp_dtype: auto           # bf16 on supported GPUs, else safe FP32 — never unsafe float16
  class_weight_cap: 10.0
  activation_checkpointing: true
  compile: false            # disabled: torch.compile + DDP froze training

wandb:
  project: nt114-hgt-paper-variants

sampler:
  hops: 3
  fanouts:
    flow__contains__packet: 20
    packet__next_packet__packet: 4
    packet__matches_technique__technique: 5
    flow__matches_technique__technique: 5
    technique__belongs_to_tactic__tactic: 1
  reverse_fanouts:
    rev_contains: 1
    rev_next_packet: 1
    rev_matches_technique: 2
    rev_belongs_to_tactic: 0
  always_include_all_tactics: true
  always_include_all_techniques: true

dataloader:
  num_workers: 2
  prefetch_factor: 2
  pin_memory: true

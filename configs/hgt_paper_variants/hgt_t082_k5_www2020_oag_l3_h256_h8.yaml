# Source: Hu et al., "Heterogeneous Graph Transformer", WWW 2020.
# Inspired config: OAG setting in the HGT paper family: shallow depth,
# wider hidden space, and 8 attention heads.
experiment:
  source_name: "Heterogeneous Graph Transformer (WWW 2020) - OAG-style"
  citation_hint: "Hu et al., Heterogeneous Graph Transformer, The Web Conference 2020"
  rationale: "Use 3 HGT layers, hidden_dim 256, and 8 heads to follow the OAG-style HGT setup while keeping K-hop runtime bounded."

data:
  graph_npz: data/processed/graph_artifact_3tier_t082_k5.npz
  graph_meta_json: data/processed/graph_artifact_3tier_t082_k5.meta.json
  packet_feature: semantic
  add_reverse_edges: true
  standardize_flow_features: true
  use_semantic_edge_weights: true

model:
  hidden_dim: 256
  num_layers: 3
  num_heads: 8
  dropout: 0.1
  ffn_multiplier: 2

train:
  output_dir: outputs/hgt_paper_variants/www2020_oag_l3_h256_h8
  epochs: 150
  batch_mode: full
  lr: 0.0005
  weight_decay: 0.00005
  val_ratio: 0.1
  test_ratio: 0.1
  patience: 30
  class_weight: balanced
  seed: 42
  device: cuda
  monitor: val_macro_f1
  log_every: 1


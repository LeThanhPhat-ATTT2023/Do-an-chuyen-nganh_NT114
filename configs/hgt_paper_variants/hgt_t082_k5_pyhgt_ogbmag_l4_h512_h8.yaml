# Source: pyHGT / OGB-MAG configuration associated with HGT experiments.
# Inspired config: larger hidden space and 4 layers for OGB-MAG node classification.
# Note: local model does not implement RTE flags explicitly, so this config only
# transfers the supported backbone hyperparameters.
experiment:
  source_name: "pyHGT OGB-MAG-style HGT"
  citation_hint: "Hu et al., Heterogeneous Graph Transformer; pyHGT OGB-MAG README"
  rationale: "Stress-test a higher-capacity HGT backbone: 512 hidden channels, 4 layers, 8 heads."

data:
  graph_npz: data/processed/graph_artifact_3tier_t082_k5.npz
  graph_meta_json: data/processed/graph_artifact_3tier_t082_k5.meta.json
  packet_feature: semantic
  add_reverse_edges: true
  standardize_flow_features: true
  use_semantic_edge_weights: true

model:
  hidden_dim: 512
  num_layers: 4
  num_heads: 8
  dropout: 0.1
  ffn_multiplier: 2

train:
  output_dir: outputs/hgt_paper_variants/pyhgt_ogbmag_l4_h512_h8
  epochs: 150
  batch_mode: full
  lr: 0.0005
  weight_decay: 0.00005
  val_ratio: 0.1
  test_ratio: 0.1
  patience: 30
  class_weight: balanced
  seed: 42
  device: cuda
  monitor: val_macro_f1
  log_every: 1
  amp: true
  activation_checkpointing: true


# Source: AWS GraphStorm HGT deployment-style defaults.
# Inspired config: compact hidden size, shallow network, high dropout for
# stable enterprise-scale/distributed training. The original GraphStorm LR
# often assumes warm-up and sparse embedding optimizers; this local script uses
# a safer AdamW LR for fair comparison.
experiment:
  source_name: "GraphStorm HGT-style compact deployment"
  citation_hint: "AWS GraphStorm model training/inference configuration documentation"
  rationale: "Use a shallow 2-layer HGT with hidden_dim 128, 8 heads, and dropout 0.5 to test regularized deployment-style behavior."

data:
  graph_npz: data/processed/graph_artifact_3tier_t082_k5.npz
  graph_meta_json: data/processed/graph_artifact_3tier_t082_k5.meta.json
  packet_feature: semantic
  add_reverse_edges: true
  standardize_flow_features: true
  use_semantic_edge_weights: true

model:
  hidden_dim: 128
  num_layers: 2
  num_heads: 8
  dropout: 0.5
  ffn_multiplier: 2

train:
  output_dir: outputs/hgt_paper_variants/graphstorm_l2_h128_h8_d05
  epochs: 150
  batch_mode: full
  lr: 0.001
  weight_decay: 0.00005
  val_ratio: 0.1
  test_ratio: 0.1
  patience: 30
  class_weight: balanced
  seed: 42
  device: cuda
  monitor: val_macro_f1
  log_every: 1


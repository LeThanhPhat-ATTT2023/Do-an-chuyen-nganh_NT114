# Source: GPT-GNN, KDD 2020, using HGT as a pre-training backbone.
# Inspired config: 3-layer HGT with a larger 400-dimensional hidden space.
# The local run is supervised fine-tuning only; generative graph pre-training is
# not implemented in this training script.
experiment:
  source_name: "GPT-GNN HGT-backbone-style"
  citation_hint: "Hu et al., Generative Pre-Training of Graph Neural Networks, KDD 2020"
  rationale: "Use 3 HGT layers and hidden_dim 400 to test a foundation/backbone-style wider representation while preserving the baseline hop depth."

data:
  graph_npz: data/processed/graph_artifact_3tier_t082_k5.npz
  graph_meta_json: data/processed/graph_artifact_3tier_t082_k5.meta.json
  packet_feature: semantic
  add_reverse_edges: true
  standardize_flow_features: true
  use_semantic_edge_weights: true

model:
  hidden_dim: 400
  num_layers: 3
  num_heads: 8
  dropout: 0.1
  ffn_multiplier: 2

train:
  output_dir: outputs/hgt_paper_variants/gptgnn_kdd2020_l3_h400_h8
  epochs: 150
  batch_mode: full
  lr: 0.0005
  weight_decay: 0.00005
  val_ratio: 0.1
  test_ratio: 0.1
  patience: 30
  class_weight: balanced
  seed: 42
  device: cuda
  monitor: val_macro_f1
  log_every: 1


# NT114 HGT v8.7 SMOKE — validates v7-baseline + 3 surgical additions.
#
# WHY v8.7 (lessons from v7/v8.5/v8.6 audit, 2026-05-23):
#   Empirical scoreboard:
#     v7    (cb_focal cap=3, no SAM, no buffer, no stratified, no DRW): macro_f1 ≈ 0.21  ← BEST
#     v8.5  (focal inverse cap=20, γ=3, SAM, EMA, HGAA+buffer):         macro_f1 = 0.12  ← regression
#     v8.6  (cb_focal cap=3, stratified, buffer, monitor=val_balanced):  macro_f1 = 0.04  ← collapse
#
#   Each "improvement" past v7 stacked an additional minority-boosting mechanism
#   (stratified sampler, HGAA buffer without filter wiring, aggressive weighting,
#   SAM doubling step cost) that created a 5+ orders-of-magnitude train/test
#   distribution mismatch. Result: high minority recall but precision near zero.
#
# v8.7 STRATEGY — return to v7 and add ONLY changes with clear evidence:
#   (1) logit_adjustment=1.0  — Menon et al. ICLR 2021 post-hoc fix for any
#       remaining train/test prior mismatch (v7 didn't have this).
#   (2) ema_enabled=true      — smoothed shadow weights, +1-3% F1 imbalanced.
#   (3) BUG #1 fix in trainer — focal loss now actually applies label_smoothing
#       (was silently dropped in v7/v8.5/v8.6 — see _compute_train_loss).
#
# EXPLICITLY OFF (each was empirically harmful or unverified):
#   sam_enabled=false              — 2x cost, no proven F1 gain on this codebase
#   stratified_batch_sampling=false — over-balances vs. natural test prior
#   drw_start_pct=0.0              — verified neutral in v7 (no effect when
#                                    weights already mild via cb cap=3)
#   hgaa.buffer_enabled=false      — filter network (ClassCentroidBank) defined
#                                    in hgaa_filter_network.py but NEVER wired
#                                    to the pipeline → augmentations bypass
#                                    plausibility check → poison minority.
#                                    Until filter is wired, buffer hurts.
#   hgaa.aug_ratio_in_batch=0.3    — lowered from 0.5: less unfiltered noise.
#   monitor=val_macro_f1           — val_balanced collapses to noise when
#                                    both metrics are near zero.
#
# Pass criteria (epoch 10, 200k subset):
#   - train_acc rising past majority baseline (~0.46) — model learns majority
#   - val_macro_f1 > 0.05 by epoch 5, climbing
#   - val_acc > 0.3 by epoch 10
#   - VulnerabilityScan F1 > 0  (v8.6 had 0.0)
#   - No NaN, no [warn] spam, EMA logged active

experiment:
  source_name: "NT114 HGT v8.7 SMOKE — v7-baseline + logit_adjustment + EMA + BUG#1 fix"
  rationale: >
    Audit (2026-05-23) showed every config addition after v7 stacked an extra
    minority-boost mechanism, creating a 5+ orders-of-magnitude train/test
    distribution mismatch. v8.7 restores v7's working baseline (cb_focal cap=3,
    no stratified, no SAM, no DRW, no buffer) and adds ONLY logit_adjustment
    (post-hoc prior fix), EMA (smoothing), and the focal+label_smoothing bug
    fix. monitor=val_macro_f1 instead of val_balanced (which collapses to
    noise when metrics are near zero).

data:
  source: graph_store
  graph_npz: /home/ubuntu/dataset/graph3/graph_artifact_3tier_14gb.npz
  graph_meta_json: /home/ubuntu/dataset/graph3/graph_artifact_3tier_14gb.meta.json
  graph_store_root: /home/ubuntu/dataset/graph_store_v1
  read_sealed_only: true
  packet_feature: semantic
  add_reverse_edges: true
  standardize_flow_features: true
  use_semantic_edge_weights: true
  use_temporal_edge_weights: true
  tew_epsilon: 1.0e-3

model:
  hidden_dim: 384
  num_layers: 4
  num_heads: 12
  dropout: 0.20
  ffn_multiplier: 4

train:
  output_dir: /home/ubuntu/outputs/smoke_v87
  epochs: 10                   # longer than v8.6 smoke (5) to see EMA + LA take hold
  max_train_flows: 200000      # subset for fast verification
  patience: 10
  batch_mode: neighbor_sampling
  batch_seed_flows: 768
  grad_accum_steps: 1

  # Optimizer — plain AdamW (NO SAM: 2x cost without evidence of F1 gain)
  lr: 0.001                    # v7 baseline (v8.5's 0.0005 was undertrained)
  weight_decay: 0.0003
  grad_clip_norm: 1.0
  adamw_eps: 1.0e-6
  adamw_betas: [0.9, 0.95]
  sam_enabled: false           # ★ OFF — see header
  sam_rho: 0.05

  # Scheduler
  scheduler: onecycle
  scheduler_pct_start: 0.10
  scheduler_eta_min: 1.0e-5

  # Loss — v7's proven cb_focal at cap=3
  loss_type: cb_focal
  focal_gamma: 2.0             # v7 default (not v8.5's 3.0)
  label_smoothing: 0.1         # NOW EFFECTIVE (BUG #1 fixed in trainer)
  ldam_max_m: 0.5
  ldam_scale: 30.0

  # Class weights — mild, no double-correction
  class_weight: balanced
  class_weight_method: cb
  class_weight_cap: 3.0
  cb_beta: 0.9999
  drw_start_pct: 0.0           # ★ OFF — empirically neutral with cap=3
  use_manifest_class_weights: false

  # ★ NEW: post-hoc logit adjustment (Menon ICLR 2021)
  logit_adjustment: 1.0        # subtract τ·log(prior) at eval to debias
  # ★ NEW: tau-normalized inference (Kang et al. ICLR 2020). Reported as a 3rd
  # eval view (TauNorm) alongside raw + LA. Shrinks majority classifier weight
  # norms post-hoc → rebalance toward rare classes WITHOUT retraining. Diagnostic
  # for whether the backbone already encodes rare-class signal.
  tau_norm: 1.0

  val_ratio: 0.1
  test_ratio: 0.1
  stratified_batch_sampling: false   # ★ OFF — train on natural distribution
  drop_edge_prob: 0.05
  ema_enabled: true            # ★ NEW
  ema_decay: 0.999
  seed: 42
  device: cuda
  monitor: val_macro_f1        # ★ not val_balanced
  log_every: 1
  amp: true
  amp_dtype: auto
  activation_checkpointing: false
  compile: true
  multi_gpu: false
  skip_val_first_epoch: true

  # HGAA — keep enabled (v7 had it on) but reduce aggressiveness:
  # buffer OFF because filter network is not wired (BUG #2). p_aug 0.5→0.3
  # to limit unfiltered noise into minority classes.
  hgaa:
    enabled: true
    ops: [edge_addition, node_feature_swap, edge_direction_swap, edge_perturbation]
    eta_per_op: 0.1
    aug_ratio_in_batch: 0.3    # ★ lowered from 0.5 (no filter wiring yet)
    smoothing: 1.0
    bias_selection_method: top_k
    bias_top_k_rarest: 3
    bias_min_class_freq: 0.01
    bias_factor_T: 0.5
    bias_preferred_op: node_feature_swap
    buffer_enabled: false      # ★ OFF — see header (filter not wired)
    buffer_pressure_threshold: 3
    buffer_max_per_batch: 100

sampler:
  hops: 4
  fanouts:
    flow__contains__packet: 6
    packet__next_packet__packet: 3
    packet__matches_technique__technique: 5
    flow__matches_technique__technique: 5
    technique__belongs_to_tactic__tactic: 1
  reverse_fanouts:
    rev_contains: 3
    rev_next_packet: 2
    rev_matches_technique: 2
    rev_belongs_to_tactic: 0
  always_include_all_tactics: true
  always_include_all_techniques: true

dataloader:
  num_workers: 8
  prefetch_factor: 16
  pin_memory: true
  persistent_workers: true

wandb:
  project: nt114-hgt-paper-variants
  run_name: smoke_v87

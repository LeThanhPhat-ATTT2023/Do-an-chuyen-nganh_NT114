# NT114 Proposed IDS-HGT — KAGGLE preview run.
#
# Purpose: get "basic metrics" on Kaggle (2× T4, 12h limit) BEFORE the full
# large-scale run on the HPC server. Same 4-layer / 256-hidden / 8-head model
# as configs/hgt_t082_k5_l3_d01.yaml — only the training budget, batch size,
# dataloader and file paths differ so a run completes inside the 12h window.
#
# ── Hardware notes ──────────────────────────────────────────────────────────
#   A40 / A100 / RTX 30xx+: native bfloat16 → amp: true activates AMP.
#     Edge-softmax and attention norms are guarded to float32 in hgt.py so
#     the non-finite-gradient issue (seen on T4) does not occur.
#     batch_seed_flows: 256 fits comfortably in 48 GB bfloat16.
#   Kaggle T4 / P100: no native bfloat16 → resolve_amp() auto-falls back to
#     FP32 even with amp: true. No manual edits needed when switching hardware.
#
# ── How to run ──────────────────────────────────────────────────────────────
#   1) Build the graph store ONCE (reuse across sessions):
#        python -m graphslm_ids.offline.training.on_disk_graph_store \
#          --graph-npz /kaggle/input/datasets/thnhphtattt2023/graph3/graph_artifact_3tier_14gb.npz \
#          --graph-meta-json /kaggle/input/datasets/thnhphtattt2023/graph3/graph_artifact_3tier_14gb.meta.json \
#          --output-root /tmp/graph_store_mmap_csr_v1
#   2) SMOKE TEST first (~20-30 min) — uncomment `max_train_flows` + set epochs: 3
#      below, then confirm in the log:
#        [AMP] disabled — running in FP32
#        [diag] first optimizer step | grad_norm=...   <- must be NON-zero
#        loss epoch 1 > epoch 2 > epoch 3              <- must decrease
#   3) Full preview run: re-comment `max_train_flows`, restore epochs, launch:
#        torchrun --nproc_per_node=2 -m graphslm_ids.offline.training.train_hgt_flow_classifier \
#          --config configs/hgt_t082_k5_l3_d01_kaggle.yaml
#      (single-GPU notebook: run the module directly, multi_gpu handles the rest)

experiment:
  source_name: "NT114 Proposed IDS-HGT — Kaggle preview (4-layer)"
  rationale: >
    Kaggle 12h-budget preview of the proposed 4-layer / 256-hidden / 8-head
    IDS-HGT. Validates that the pipeline learns end-to-end and produces baseline
    metrics; the authoritative result comes from the HPC large-scale run.

data:
  source: graph_store
  # Kaggle paths — adjust only if your dataset slug differs.
  graph_npz: /kaggle/input/datasets/thnhphtattt2023/graph3/graph_artifact_3tier_14gb.npz
  graph_meta_json: /kaggle/input/datasets/thnhphtattt2023/graph3/graph_artifact_3tier_14gb.meta.json
  graph_store_root: /tmp/graph_store_mmap_csr_v1
  read_sealed_only: true
  packet_feature: semantic
  add_reverse_edges: true
  standardize_flow_features: true
  use_semantic_edge_weights: true

model:
  hidden_dim: 256
  num_layers: 4
  num_heads: 8
  dropout: 0.15
  ffn_multiplier: 4

train:
  output_dir: outputs/nt114_proposed_l4_h256_h8_kaggle
  epochs: 12               # T4 FP32 on the 1.5M-flow graph: ~6-12 epochs fit in 12h
  patience: 5              # best checkpoint is saved continuously — safe if the 12h cap hits first
  batch_mode: neighbor_sampling
  batch_seed_flows: 128    # safe on T4 16GB FP32; A40 48GB bf16 has ~4× headroom
  grad_accum_steps: 2      # effective batch 256/GPU (×2 GPUs via DDP = 512)
  lr: 0.0005
  weight_decay: 0.0001
  grad_clip_norm: 1.0
  scheduler: cosine_annealing
  scheduler_eta_min: 1.0e-5
  val_ratio: 0.1
  test_ratio: 0.1
  class_weight: balanced
  class_weight_cap: 15.0
  seed: 42
  device: cuda
  monitor: val_macro_f1
  log_every: 1
  stratified_batch_sampling: true
  amp: true                # bfloat16 on A40/Ampere+ (native hw support). Falls back to FP32
                           # automatically on T4/P100 (no native bf16). Edge-softmax and
                           # attention norms are guarded to float32 in hgt.py — numeric fix verified.
  amp_dtype: auto          # auto → bfloat16 on supported hw, float32 otherwise.
  activation_checkpointing: true
  compile: false
  multi_gpu: true
  # --- SMOKE TEST ONLY: uncomment the next line + set `epochs: 3` above ---
  # max_train_flows: 60000

sampler:
  hops: 4
  fanouts:
    flow__contains__packet: 8
    packet__next_packet__packet: 4
    packet__matches_technique__technique: 5
    flow__matches_technique__technique: 5
    technique__belongs_to_tactic__tactic: 1
  reverse_fanouts:
    rev_contains: 3
    rev_next_packet: 2
    rev_matches_technique: 2
    rev_belongs_to_tactic: 0
  always_include_all_tactics: true
  always_include_all_techniques: true

dataloader:
  num_workers: 2           # Kaggle nodes expose ~4 CPU cores
  prefetch_factor: 2
  pin_memory: true
  persistent_workers: true

wandb:
  project: nt114-hgt-paper-variants
  run_name: proposed_l4_h256_h8_kaggle

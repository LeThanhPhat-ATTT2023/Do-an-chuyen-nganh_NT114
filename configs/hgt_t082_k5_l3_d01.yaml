# NT114 Proposed IDS-HGT — synthesized from 6 paper-variant analyses.
#
# Design rationale (per-axis):
#
#   num_layers=4:
#     The 3-tier graph has a natural 3-hop path (flow→packet→technique→tactic).
#     one2/xgnid show 1 layer is insufficient. relgt/ahgt show 3 layers covers
#     the hierarchy. We add 1 more layer for global context without the cost and
#     overfitting risk of gatransformer's 6 layers.
#
#   hidden_dim=256, num_heads=8 → head_dim=32:
#     relgt uses 8 heads but hidden=128 → head_dim=16 (too small per head).
#     gatransformer uses 256 hidden / 8 heads → head_dim=32 (stable gradient
#     norm, no overflow). ahgt/dlg use 4 heads, which under-represents the 5
#     distinct edge-type relations in the graph. head_dim=32 matches the sweet
#     spot validated by gatransformer without its depth overhead.
#
#   ffn_multiplier=4:
#     All 6 paper variants use 2×, which is half the standard Transformer FFN
#     ratio. Upgrading to 4× (256→1024→256) gives more expressive non-linearity
#     at negligible VRAM cost under neighbor sampling; it is the single largest
#     capacity gap between our baseline and standard Transformer design.
#
#   dropout=0.15:
#     ahgt-dfd insight: the model should resist catastrophic forgetting across
#     time windows (higher dropout). 0.15 is between dlg/relgt (0.1) and the
#     higher values used in large Transformer models. Prevents overfitting on
#     imbalanced IDS data where majority-class patterns dominate.
#
#   class_weight_cap=15.0:
#     Uncapped balanced weights reach 44.5× for class 10 (2 604 samples) on
#     this dataset, causing loss spikes →600 that overflow float16 gradients.
#     15.0 retains 15× emphasis on rare attack classes while keeping the
#     worst-case loss under ~40 — safely scalable to larger imbalanced datasets.
#
#   lr=0.0005, cosine_annealing, grad_accum_steps=2 (DDP x2 GPUs):
#     With DDP world_size=2 and batch_seed_flows=256 per GPU, effective global
#     batch = 256 × 2 × 2 = 1024. A 4-layer model needs a moderate LR;
#     0.0005 is between ahgt (0.001) and the original 0.0002.
#     cosine_annealing avoids the pct_start misalignment that caused instability
#     when OneCycleLR's decay phase was entered before convergence.
#
# ── Large-dataset notes (500 GB – 1 TB raw PCAP) ────────────────────────────
#   When scaling to large datasets, override these fields:
#
#     train:
#       epochs: 20                  # large dataset = many more steps/epoch
#       patience: 5
#       batch_seed_flows: 256       # larger batch per GPU
#       grad_accum_steps: 2         # effective batch 512 still
#
#     dataloader:
#       num_workers: 8              # HPC has many CPU cores
#       prefetch_factor: 4
#       persistent_workers: true
#
#     sampler:
#       always_include_all_techniques: false   # too many nodes in large graph
#
#   The model architecture (layers/hidden/heads/ffn) does NOT change — neighbor
#   sampling loads the same subgraph size regardless of total graph scale.

experiment:
  source_name: "NT114 Proposed IDS-HGT (4-layer synthesis)"
  rationale: >
    Synthesizes the key architectural insights from all 6 paper variants:
    adequate depth (4 layers, vs. 1–6 in comparisons), rich multi-head
    attention (8 heads / head_dim=32), standard FFN ratio (4×, vs. 2× in all
    comparisons), and conservative training schedule tuned for class-imbalanced
    IDS data. Serves as the proposed model contribution in the NT114 Q1 paper.

data:
  source: graph_store
  graph_npz: data/processed/graph_artifact_3tier_t082_k5.npz
  graph_meta_json: data/processed/graph_artifact_3tier_t082_k5.meta.json
  graph_store_root: data/graph_store_v1
  read_sealed_only: true
  packet_feature: semantic
  add_reverse_edges: true
  standardize_flow_features: true
  use_semantic_edge_weights: true

model:
  hidden_dim: 256
  num_layers: 4
  num_heads: 8
  dropout: 0.15
  ffn_multiplier: 4

train:
  output_dir: outputs/nt114_proposed_l4_h256_h8
  epochs: 100
  batch_mode: neighbor_sampling
  batch_seed_flows: 256
  grad_accum_steps: 2
  lr: 0.0005
  weight_decay: 0.0001
  grad_clip_norm: 1.0       # 0.5 was too aggressive for a 4-layer/256-hidden HGT and
                            # crushed the gradient signal; 1.0 matches the working baseline.
  scheduler: cosine_annealing
  scheduler_eta_min: 1.0e-5
  val_ratio: 0.1
  test_ratio: 0.1
  patience: 40
  class_weight: balanced
  class_weight_cap: 15.0
  seed: 42
  device: cuda
  monitor: val_macro_f1
  log_every: 1
  stratified_batch_sampling: true
  amp: false                # FORCED FP32: bf16 froze training — every optimizer step was
                            # skipped for non-finite gradients. AMP is also force-disabled in code.
  amp_dtype: auto           # ignored while amp is false.
  activation_checkpointing: true   # keeps activation memory low for 500GB-1TB scale runs.
  compile: false            # torch.compile + DDP + variable-shape neighbour batches silently
                            # broke gradient flow. Re-enable only after a run is confirmed to learn.
  multi_gpu: true           # auto-uses every visible GPU (DDP via torchrun, or legacy replicate).

sampler:
  hops: 4
  fanouts:
    flow__contains__packet: 8
    packet__next_packet__packet: 4
    packet__matches_technique__technique: 5
    flow__matches_technique__technique: 5
    technique__belongs_to_tactic__tactic: 1
  reverse_fanouts:
    rev_contains: 3
    rev_next_packet: 2
    rev_matches_technique: 2
    rev_belongs_to_tactic: 0
  always_include_all_tactics: true
  always_include_all_techniques: true   # set false for large datasets (>10K techniques)

dataloader:
  num_workers: 2          # increase to 8 on HPC server
  prefetch_factor: 4      # increase on HPC server
  pin_memory: true
  persistent_workers: true

wandb:
  project: nt114-hgt-paper-variants
  run_name: proposed_l4_h256_h8

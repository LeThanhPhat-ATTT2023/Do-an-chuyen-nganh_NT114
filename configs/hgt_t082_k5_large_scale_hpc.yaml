# NT114 Proposed IDS-HGT — large-scale HPC variant (500 GB – 1 TB raw PCAP).
#
# This file inherits the same model architecture as hgt_t082_k5_l3_d01.yaml
# (the proposed model). Only the data pipeline, training schedule, and
# dataloader settings differ to match HPC server constraints:
#
#   - epochs reduced: large datasets have far more batches per epoch, so 200
#     epochs would run for weeks. Target ~20 epochs = similar total steps.
#   - batch_seed_flows doubled: HPC GPUs (A100 80 GB) can hold larger batches.
#   - num_workers 8: HPC nodes typically have 32–128 CPU cores.
#   - always_include_all_techniques disabled: with a large graph (millions of
#     flows), the technique set can exceed 10K nodes — forcing all into every
#     subgraph would make batches unmanageably large.
#   - persistent_workers: avoids re-spawning worker processes between epochs.
#   - prefetch_factor 4: aggressive prefetch to hide I/O latency from NFS/Lustre.
#
# Run with torchrun via the SLURM script:
#   sbatch scripts/slurm/train_hgt.sh configs/hgt_t082_k5_large_scale_hpc.yaml

experiment:
  source_name: "NT114 Proposed IDS-HGT — HPC large-scale"
  rationale: >
    Same 4-layer / 256-hidden / 8-head architecture as the Kaggle proposed
    model, re-tuned for 500 GB – 1 TB raw-PCAP scale on a university HPC
    cluster (SLURM + multi-GPU A100). Training schedule and dataloader settings
    are adjusted for throughput; model weights are directly comparable.

data:
  source: graph_store
  graph_store_root: data/graph_store_v1   # point to the large graph_store path
  read_sealed_only: true
  packet_feature: semantic
  add_reverse_edges: true
  standardize_flow_features: true
  use_semantic_edge_weights: true

model:
  hidden_dim: 256
  num_layers: 4
  num_heads: 8
  dropout: 0.15
  ffn_multiplier: 4

train:
  output_dir: outputs/nt114_proposed_l4_h256_h8_large
  epochs: 20              # ~same total steps as 200 epochs on small dataset
  batch_mode: neighbor_sampling
  batch_seed_flows: 256   # A100 handles 2× seeds comfortably
  grad_accum_steps: 2     # effective batch 512 (256 × 2), same as Kaggle run
  lr: 0.0002
  weight_decay: 0.0001
  grad_clip_norm: 0.5
  scheduler: cosine_annealing
  scheduler_eta_min: 1.0e-5
  val_ratio: 0.05         # 5% val is enough with millions of flows
  test_ratio: 0.05
  patience: 5             # proportional to epochs (was 30/200 = 15%)
  class_weight: balanced
  class_weight_cap: 15.0
  seed: 42
  device: cuda
  monitor: val_macro_f1
  log_every: 1
  stratified_batch_sampling: true
  amp: true
  amp_dtype: bfloat16     # A100 native BF16 — no overflow risk at any scale
  activation_checkpointing: true

sampler:
  hops: 4
  fanouts:
    flow__contains__packet: 20
    packet__next_packet__packet: 4
    packet__matches_technique__technique: 5
    flow__matches_technique__technique: 5
    technique__belongs_to_tactic__tactic: 1
  reverse_fanouts:
    rev_contains: 1
    rev_next_packet: 1
    rev_matches_technique: 2
    rev_belongs_to_tactic: 0
  always_include_all_tactics: true
  always_include_all_techniques: false  # must be false at large scale

dataloader:
  num_workers: 8            # 2 per GPU on a 4-GPU node
  prefetch_factor: 4
  pin_memory: true
  persistent_workers: true  # avoid worker respawn overhead between epochs

wandb:
  project: nt114-hgt-large-scale
  run_name: proposed_l4_h256_h8_hpc

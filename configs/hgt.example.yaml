data:
  # "graph_store" = mmap CSR (recommended for large graphs, no full-graph RAM load)
  # "npz"         = load full NPZ into RAM (small graphs / quick experiments only)
  # To build the graph store first time:
  #   python src/graphslm_ids/offline_path/training/on_disk_graph_store.py \
  #     --graph-npz data/processed/graph_artifact_3tier_t082_k5.npz \
  #     --graph-meta-json data/processed/graph_artifact_3tier_t082_k5.meta.json \
  #     --output-root data/graph_store_v1
  source: graph_store
  graph_npz: data/processed/graph_artifact_3tier_t082_k5.npz
  graph_meta_json: data/processed/graph_artifact_3tier_t082_k5.meta.json
  graph_store_root: data/graph_store_v1
  read_sealed_only: true
  packet_feature: semantic
  add_reverse_edges: true
  standardize_flow_features: true
  use_semantic_edge_weights: true

model:
  hidden_dim: 128
  num_layers: 3
  num_heads: 4
  dropout: 0.1
  ffn_multiplier: 2

train:
  output_dir: outputs/hgt_flow_classifier_t082_k5_l3_d01
  epochs: 200
  # "neighbor_sampling" = mini-batch (required for large graphs)
  # "full"              = full-graph training (OOM on large graphs)
  batch_mode: neighbor_sampling
  batch_seed_flows: 256
  grad_accum_steps: 4
  lr: 0.001
  weight_decay: 0.00005
  val_ratio: 0.1
  test_ratio: 0.1
  patience: 30
  class_weight: balanced
  seed: 42
  device: cpu
  monitor: val_macro_f1
  log_every: 1
  amp: false
  activation_checkpointing: false

sampler:
  hops: null
  fanouts:
    flow__contains__packet: 20
    packet__next_packet__packet: 4
    packet__matches_technique__technique: 5
    flow__matches_technique__technique: 5
    technique__belongs_to_tactic__tactic: 1
  reverse_fanouts:
    rev_contains: 1
    rev_next_packet: 1
    rev_matches_technique: 0
    rev_belongs_to_tactic: 0
  always_include_all_tactics: true
  always_include_all_techniques: true

dataloader:
  num_workers: 0
  prefetch_factor: 2
  pin_memory: false

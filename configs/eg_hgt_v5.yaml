# EG-HGT v5 — Recipe re-calibration (fix the minority precision-sink).
#
# Design:  docs/superpowers/specs/2026-06-07-v5-deterministic-representation-design.md
# Phase 0: docs/reports/2026-06-07-v4-phase0-confusion-findings.md
#
# Root cause (PROVEN by confusion matrix + zero-retrain logit-adjustment probe):
#   v4 over-weights rare classes (cb_beta 0.9999 + cap 15) → the model dumps uncertain
#   flows into rare classes. Backdoor_Malware became a precision sink: 784 flows predicted
#   Backdoor, only 298 correct, 481 were Benign (26% of Benign leaked in). This single
#   miscalibration sank BOTH Benign (R 0.60) and Backdoor (P 0.38).
#   A post-hoc logit-adjustment τ=-0.5..-1.0 (penalize rare) lifted v4 from macro-F1 0.863
#   to ~0.90-0.92 on the SAME checkpoint with NO retrain — proving the model already has the
#   discriminative power; v4 just miscalibrated it.
#
# This config bakes the fix into TRAINING (cleaner than a hand-tuned negative τ):
#   [V5-1] cb_beta 0.9999 -> 0.99   : near-uniform effective weights for big classes; tiny
#          web classes (n=29-72) still get ~4x. Stops the Backdoor over-weighting.
#   [V5-2] class_weight_cap 15 -> 6 : Backdoor was capped at 15x Benign; now <=6x.
#   [V5-3] epochs 50 -> 70          : v4 best was epoch 40; train to real convergence.
#   Everything else identical to v4 (same relabeled graph outputs/v4, GCL, sampler, HGAA).
#   Ordered-byte feature + per-class windowing come in the next iteration (graph rebuild).

experiment:
  source_name: "EG-HGT v5 (recipe re-calibration: milder CB weights, fix precision sinks)"
  rationale: >
    Phase-0 confusion analysis proved the five low-F1 classes are mostly ONE problem:
    Backdoor_Malware is a precision sink that eats Benign, caused by v4's aggressive
    minority weighting. A zero-retrain logit-adjustment probe (τ<0) lifted v4 0.863->~0.92,
    confirming the model is under-calibrated, not under-powered. v5 fixes the calibration at
    the source (cb_beta 0.9999->0.99, cap 15->6) so the gain is baked into a clean model.

data:
  artifact_version: v3
  graph_npz: outputs/v4/graph.npz
  graph_meta_json: outputs/v4/graph.meta.json
  splits_json: outputs/v4/splits.json
  split_protocol: random
  add_reverse_edges: true
  standardize_flow_features: true
  use_semantic_edge_weights: true
  use_temporal_edge_weights: true
  tew_epsilon: 1.0e-3

model:
  hidden_dim: 128
  num_layers: 4
  num_heads: 8
  dropout: 0.2
  ffn_multiplier: 2

train:
  output_dir: outputs/v3/hgt_v5
  epochs: 70
  patience: 25
  batch_seed_flows: 256
  grad_accum_steps: 2
  monitor: val_macro_f1
  log_every: 1
  lr: 1.0e-3
  weight_decay: 5.0e-5
  amp: true
  amp_dtype: auto
  device: cuda
  activation_checkpointing: true
  compile: false
  tf32: true
  scheduler: cosine_annealing
  scheduler_pct_start: 0.05
  scheduler_eta_min: 1.0e-5
  grad_clip_norm: 1.0
  adamw_eps: 1.0e-6
  adamw_betas: [0.9, 0.95]

  # Loss
  loss_type: focal
  focal_gamma: 2.0
  label_smoothing: 0.05

  # Class weights — RE-CALIBRATED (the core v5 fix)
  class_weight: balanced
  class_weight_method: cb
  cb_beta: 0.99                # [V5-1] was 0.9999 — stop over-weighting rare classes
  class_weight_cap: 6.0        # [V5-2] was 15.0 — Backdoor no longer a precision sink

  drw_start_pct: 0.0
  logit_adjustment: 0.0        # inference τ re-tuned on VAL post-training (proven lever)

  # Misc training
  drop_edge_prob: 0.10
  ema_enabled: true
  ema_decay: 0.999
  skip_val_first_epoch: false
  eval_every: 1
  val_ratio: 0.1
  test_ratio: 0.1
  seed: 42
  stratified_batch_sampling: true

  # GCL auxiliary loss (kept — academic novelty)
  gcl_enabled: true
  gcl_weight: 0.3
  gcl_temperature: 0.1
  gcl_positive_source: class_technique_map
  gcl_n_negatives: 16

  # HGAA augmentation
  hgaa:
    enabled: true
    aug_ratio_in_batch: 0.4
    bias_factor_T: 0.5
    bias_top_k_rarest: 6

sampler:
  hops: 4
  fanouts:
    flow__contains__packet: 20
    packet__next_packet__packet: 4
    packet__evidence_injection__technique: 4
    packet__evidence_command_exec__technique: 4
    packet__evidence_file_upload__technique: 3
    packet__evidence_recon__technique: 3
    packet__evidence_c2_beacon__technique: 3
    flow__from_host__host: 1
    flow__to_host__host: 1
    flow__burst_neighbor__flow: 6
    flow__matches_technique__technique: 3
    technique__has_subtechnique__technique: 2
    technique__belongs_to_tactic__tactic: 1
  reverse_fanouts:
    rev_contains: 3
    rev_next_packet: 2
    rev_evidence_injection: 2
    rev_evidence_command_exec: 2
    rev_evidence_file_upload: 2
    rev_evidence_recon: 2
    rev_evidence_c2_beacon: 2
    rev_from_host: 3
    rev_to_host: 3
    rev_burst_neighbor: 3
    rev_matches_technique: 2
    rev_has_subtechnique: 2
    rev_belongs_to_tactic: 1
  always_include_all_techniques: true
  always_include_all_tactics: true

dataloader:
  num_workers: 6
  prefetch_factor: 4
  pin_memory: true
  persistent_workers: true

feature_store:
  enabled: true
  cache_fraction: 0.6
  model_reserve_gb: 4.0
  n_warmup_batches: 200

gpu_sampling:
  enabled: false

# NT114 HGT — OVERFIT PROBE (representation-capacity diagnostic, NOT a real run).
#
# PURPOSE: definitively answer "are the graph features even separable per class?"
# Across v7/v8.5/v8.6/v8.7 every recipe plateaued ~0.12-0.21 macro_f1, and even
# VulnerabilityScan (700K samples, fully trained) only reached F1=0.32 in v8.5 —
# the signature of a REPRESENTATION bottleneck, not an imbalance/recipe problem.
# Post-hoc rebalancing (logit-adjustment, tau-norm) gave ~0 lift, confirming the
# class signal isn't in the logits.
#
# This probe trains on a TINY BALANCED subset (<=150 flows/class) with ALL
# regularization OFF and many epochs. It is a pure capacity test:
#
#   train_acc -> 0.95+   => features ARE separable. Bottleneck is imbalance/
#                           sampling -> cRT / balanced training is the path to 0.65.
#   train_acc stuck <0.6 => features CANNOT separate classes even when memorizing
#                           a handful of examples -> the graph/feature pipeline is
#                           the bottleneck; recipe tuning is futile. Fix features.
#
# WATCH: the `train_acc=` field in the epoch log (NOT val — val is irrelevant
# here since the tiny train set won't generalize). eval_every=20 keeps the full
# val eval from dominating runtime.

experiment:
  source_name: "NT114 HGT OVERFIT PROBE — can the model memorize a balanced subset?"
  rationale: >
    Capacity sanity check. Tiny balanced subset, regularization off, many
    epochs. Watching train_acc tells us whether the representation can separate
    classes at all, isolating feature quality from class imbalance.

data:
  source: graph_store
  graph_npz: /home/ubuntu/dataset/graph3/graph_artifact_3tier_14gb.npz
  graph_meta_json: /home/ubuntu/dataset/graph3/graph_artifact_3tier_14gb.meta.json
  graph_store_root: /home/ubuntu/dataset/graph_store_v1
  read_sealed_only: true
  packet_feature: semantic
  add_reverse_edges: true
  standardize_flow_features: true
  use_semantic_edge_weights: true
  use_temporal_edge_weights: true
  tew_epsilon: 1.0e-3

model:
  hidden_dim: 384
  num_layers: 4
  num_heads: 12
  dropout: 0.0                  # ★ OFF — we WANT overfitting
  ffn_multiplier: 4

train:
  output_dir: /home/ubuntu/outputs/overfit_probe
  epochs: 80
  balanced_subset_per_class: 150   # ★ tiny BALANCED train set (~1950 flows)
  max_train_flows: 0
  patience: 999                 # ★ never early-stop; we want the full curve
  batch_mode: neighbor_sampling
  batch_seed_flows: 256
  grad_accum_steps: 1

  lr: 0.001
  weight_decay: 0.0             # ★ OFF — no regularization
  grad_clip_norm: 1.0
  adamw_eps: 1.0e-6
  adamw_betas: [0.9, 0.95]
  sam_enabled: false

  scheduler: onecycle
  scheduler_pct_start: 0.10
  scheduler_eta_min: 1.0e-5

  loss_type: ce                 # plain CE — cleanest capacity signal
  label_smoothing: 0.0          # ★ OFF — allow full confidence (overfit)
  focal_gamma: 2.0

  class_weight: none            # ★ balanced subset already, no weighting
  class_weight_method: none
  drw_start_pct: 0.0
  use_manifest_class_weights: false

  logit_adjustment: 0.0         # off — we read RAW train_acc
  tau_norm: 0.0

  val_ratio: 0.1
  test_ratio: 0.1
  stratified_batch_sampling: false   # subset is already balanced
  drop_edge_prob: 0.0           # ★ OFF — no edge regularization
  ema_enabled: false
  seed: 42
  device: cuda
  monitor: val_macro_f1
  eval_every: 20                # ★ full val is irrelevant here; eval rarely
  log_every: 1
  amp: true
  amp_dtype: auto
  activation_checkpointing: false
  compile: true
  multi_gpu: false
  skip_val_first_epoch: true

  hgaa:
    enabled: false              # ★ OFF — no augmentation

sampler:
  hops: 4
  fanouts:
    flow__contains__packet: 6
    packet__next_packet__packet: 3
    packet__matches_technique__technique: 5
    flow__matches_technique__technique: 5
    technique__belongs_to_tactic__tactic: 1
  reverse_fanouts:
    rev_contains: 3
    rev_next_packet: 2
    rev_matches_technique: 2
    rev_belongs_to_tactic: 0
  always_include_all_tactics: true
  always_include_all_techniques: true

dataloader:
  num_workers: 8
  prefetch_factor: 16
  pin_memory: true
  persistent_workers: true

wandb:
  project: nt114-hgt-paper-variants
  run_name: overfit_probe

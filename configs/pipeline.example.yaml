project:
  name: graphslm-contextual-ids
  seed: 42

data:
  input_glob:
    - data/raw/**/*.pcap
    - data/raw/**/*.pcapng
  output_dir: data/interim/payload_dataset
  payload_length: 256
  max_packets_per_file: null
  include_empty_payload: false

teacher:
  model_name: ehsanaghaei/SecureBERT
  batch_size: 64
  max_length: 512
  l2_normalize: true
  output_path: data/processed/teacher_targets.npy

mitre:
  techniques_csv: data/mitre/mitre_techniques.csv
  embedding_path: data/mitre/mitre_techniques_embeddings.npy
  technique_tactic_csv: data/mitre/mitre_technique_tactic_edges.csv
  similarity_threshold: 0.82
  packet_top_k: 5
  flow_top_k: 5

fast_path:
  student_onnx: outputs/student_cnn/student_cnn.onnx
  mitre_embeddings: data/mitre/mitre_techniques_embeddings.npy
  techniques_csv: data/mitre/mitre_techniques.csv
  technique_tactic_csv: data/mitre/mitre_technique_tactic_edges.csv
  mitre_topk: 5
  mitre_threshold: 0.82
  payload_length: 256

hot_graph:
  ttl_seconds: 60
  max_events: 100000
  max_packets_per_flow: 64
  max_techniques_per_node: 5

preprocessor:
  sigc:
    enabled: true
    score_formula: "semantic_weight * min(1, (src_out_degree + 1) / (dst_in_degree + 1)) * exp(-alpha * hop_distance)"
    alpha: 0.4
    min_score_to_keep_edge: 0.15
    apply_to_edge_types:
      - flow__contains__packet
      - packet__next_packet__packet
      - packet__matches_technique__technique

graph_store:
  enabled: true
  root: data/graph_store_v1
  shard_seal:
    by_time_seconds: 3600
    by_size_nodes: 6000
  retention:
    hot_window_seconds: 300
    warm_window_days: 7
    cold_window_days: 90
    drop_after_days: 365
  disk_quota_gb: 500
  on_quota_exceeded: drop_oldest

subgraph_builder:
  dlg_ids_top_n:
    enabled: true
    top_n_per_seed:
      flow__contains__packet: 24
      packet__next_packet__packet: 4
      packet__matches_technique__technique: 5
      flow__matches_technique__technique: 5
    sort_by: semantic_edge_weight
    fallback_to_random_when_tie: true

hgt:
  graph_npz: data/processed/graph_artifact_3tier_t082_k5.npz
  graph_meta_json: data/processed/graph_artifact_3tier_t082_k5.meta.json
  packet_feature: semantic
  add_reverse_edges: true
  standardize_flow_features: true
  use_semantic_edge_weights: true
  hidden_dim: 128
  num_layers: 3
  num_heads: 4
  dropout: 0.1
  lr: 0.001
  weight_decay: 0.00005
  val_ratio: 0.1
  test_ratio: 0.1
  patience: 30
  class_weight: balanced
  seed: 42
  device: cpu
  monitor: val_macro_f1
  output_dir: outputs/hgt_flow_classifier_t082_k5_l3_d01

hgt_runtime:
  checkpoint: outputs/hgt_flow_classifier_t082_k5_l3_d01/hgt_flow_best.pt
  graph_meta_json: data/processed/graph_artifact_3tier_t082_k5.meta.json
  device: cpu
  num_layers: 3
  packet_feature: semantic
  add_reverse_edges: true
  standardize_flow_features: true
  use_semantic_edge_weights: true

policy:
  alert_threshold: 0.70
  # benign_labels: bất kỳ nhãn nào KHÔNG nằm trong danh sách này và vượt threshold đều bắn alert.
  # Đây là cách khuyến nghị khi dùng checkpoint HGT với nhãn thật (Benign, DoS, PortScan, ...).
  benign_labels:
    - Benign
  # alert_labels (tuỳ chọn): chỉ bắn alert cho đúng những nhãn được liệt kê.
  # Bỏ comment và điền nhãn cụ thể nếu muốn whitelist thay vì dùng benign_labels.
  # alert_labels:
  #   - DoS Hulk
  #   - PortScan

slow_path:
  enabled: true
  queue_timeout: 1.0
  queue_max_size: 1000
  max_cf_packets: 10
  top_packets: 5
  top_techniques: 5
  top_paths: 5
  max_payload_preview_bytes: 64
  cold_source: graph_store
  cold_store: data/runtime/events.jsonl

cold_store:
  path: data/runtime/events.jsonl

slm:
  backend: ollama
  model: qwen2.5:3b-instruct-q4_k_m
  fallback_models:
    - llama3.2:3b-instruct-q4_k_m
    - phi3.5:3.8b-mini-instruct-q4_k_m
    - qwen2.5:1.5b-instruct-q4_k_m
  temperature: 0.15
  top_p: 0.80
  repeat_penalty: 1.10
  context_length: 8192
  max_new_tokens: 1500
  tier2_max_new_tokens: 800
  timeout_seconds: 30

validator:
  grounding_threshold: 0.60
  max_hallucinated_entities: 2
  max_unsupported_claims: 0
  require_mitre_caution: true

# P1 group-targeted attackers (6 cells): HGT, p80, all attackers inside gateway group G2, ratio 0.2.
# `multi_krum` / `signguard` are placeholders for "the two strongest comparison defenses": replace
# them after the P0 results (spec 3.12). `max_flows_per_client: 2000` is a placeholder (pilot).
# The one-value `partition` and `placement` axes only label the cells: `partition` matches the P0
# no-attack cells (attack impact), `placement` keeps them apart from the P0 cells in a pivot table.
base_config: configs/fl/fl_base.yaml
output_root: outputs/fl/matrix_p1_group
name_template: "{attack}__{defense}"
overrides:
  attack.malicious_ratio: 0.2
  partition.max_flows_per_client: 2000
  output.save_checkpoints: false
axes:
  partition:
    p80: {partition.dominance: 0.8}
  placement:
    g2: {attack.placement: "group:G2"}
  defense:
    multi_krum: {defense.aggregator: {name: multi_krum}}
    signguard: {defense.aggregator: {name: signguard}}
    raguard: {defense.aggregator: {name: raguard}}
  attack:
    alie: {attack.name: alie}
    min_max: {attack.name: min_max}

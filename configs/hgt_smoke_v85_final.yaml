# NT114 HGT v8.5-FINAL SMOKE — pre-flight validation for the one-shot run.
#
# Runs ALL FIVE v8.5 features on a small data subset for 5 epochs to verify
# the integrated stack does not crash and produces a learning signal:
#   1. SAM optimizer        → expect "[optimizer] SAM(AdamW) rho=0.05" at startup
#                             and "[diag] first optimizer step (SAM)" at epoch 1
#   2. BufferGraph          → expect "[hgaa] BufferGraph enabled" + buffer_created_total > 0
#   3. TEW                  → expect "[TEW] temporal edge weights enabled"
#   4. Focal + inverse wts  → loss should fall below ln(num_classes) within 3 epochs
#   5. Logit adjustment     → applied at val/test eval
#
# Pass criteria (epoch 5):
#   - val_macro_f1 > 0.15 (NOT frozen at ~1/num_classes)
#   - [warn][SAM] skips < 5 total
#   - no NaN, no crash, all five startup logs present

experiment:
  source_name: "NT114 HGT v8.5-FINAL SMOKE — Focal-SAM + BufferGraph + TEW pre-flight"
  rationale: >
    Validates the integrated v8.5 stack (SAM + BufferGraph + TEW + fixed
    weights + logit adjustment) before committing to the ~38h one-shot run.
    Small subset, 5 epochs, EMA off for a clean per-epoch learning signal.

data:
  source: graph_store
  graph_npz: /home/ubuntu/dataset/graph3/graph_artifact_3tier_14gb.npz
  graph_meta_json: /home/ubuntu/dataset/graph3/graph_artifact_3tier_14gb.meta.json
  graph_store_root: /home/ubuntu/dataset/graph_store_v1
  read_sealed_only: true
  packet_feature: semantic
  add_reverse_edges: true
  standardize_flow_features: true
  use_semantic_edge_weights: true
  use_temporal_edge_weights: true
  tew_epsilon: 1.0e-3
  laplacian_pe_path: null

model:
  hidden_dim: 384
  num_layers: 4
  num_heads: 12
  dropout: 0.20
  ffn_multiplier: 4

train:
  output_dir: /home/ubuntu/outputs/smoke_v85_final
  epochs: 5
  max_train_flows: 200000
  patience: 5
  batch_mode: neighbor_sampling
  batch_seed_flows: 768
  grad_accum_steps: 1

  lr: 0.0005
  weight_decay: 0.0003
  grad_clip_norm: 1.0
  adamw_eps: 1.0e-6
  adamw_betas: [0.9, 0.95]
  sam_enabled: true
  sam_rho: 0.05

  scheduler: onecycle
  scheduler_pct_start: 0.10
  scheduler_eta_min: 1.0e-5

  loss_type: focal
  focal_gamma: 3.0
  label_smoothing: 0.0
  ldam_max_m: 0.5
  ldam_scale: 30.0

  class_weight: balanced
  class_weight_method: inverse
  class_weight_cap: 20.0
  cb_beta: 0.9999
  drw_start_pct: 0.0

  logit_adjustment: 0.5

  val_ratio: 0.1
  test_ratio: 0.1
  stratified_batch_sampling: false
  drop_edge_prob: 0.05
  ema_enabled: false           # smoke: disabled for clean per-epoch signal
  ema_decay: 0.999
  seed: 42
  device: cuda
  monitor: val_macro_f1
  log_every: 1
  amp: true
  amp_dtype: auto
  activation_checkpointing: false
  compile: true
  multi_gpu: false
  skip_val_first_epoch: true

  hgaa:
    enabled: true
    ops: [edge_addition, node_feature_swap, edge_direction_swap, edge_perturbation]
    eta_per_op: 0.1
    aug_ratio_in_batch: 0.5
    smoothing: 1.0
    bias_selection_method: top_k
    bias_top_k_rarest: 3
    bias_min_class_freq: 0.01
    bias_factor_T: 0.5
    bias_preferred_op: node_feature_swap
    buffer_enabled: true
    buffer_pressure_threshold: 3
    buffer_max_per_batch: 100

sampler:
  hops: 4
  fanouts:
    flow__contains__packet: 6
    packet__next_packet__packet: 3
    packet__matches_technique__technique: 5
    flow__matches_technique__technique: 5
    technique__belongs_to_tactic__tactic: 1
  reverse_fanouts:
    rev_contains: 3
    rev_next_packet: 2
    rev_matches_technique: 2
    rev_belongs_to_tactic: 0
  always_include_all_tactics: true
  always_include_all_techniques: true

dataloader:
  num_workers: 8
  prefetch_factor: 16
  pin_memory: true
  persistent_workers: true

wandb:
  project: nt114-hgt-paper-variants
  run_name: smoke_v85_final
